<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Mosha Mara: an Ikirmikir SDK example</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1430; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none }
    canvas { display: block; width: 100vw; height: 100vh }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Mosha Mara: tap the mosquitoes"></canvas>
  <!-- The SDK file, copied next to the game (gives window.Ikirmikir). -->
  <script src="ikirmikir.js"></script>
  <script src="game.js"></script>
</body>
</html>
