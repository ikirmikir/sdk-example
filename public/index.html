<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Mosha Mara: an Ikirmikir SDK example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Mosha Mara: tap the mosquitoes"></canvas>

  <div id="hud" hidden>
    <span class="chip">Swatted <b id="score">0</b></span>
    <span class="chip" id="timeChip"><b id="time">30</b>s</span>
  </div>
  <p id="paused" class="big" hidden>Paused</p>

  <!-- A game starts only from the Start or Play again button, never from a stray tap on the screen. -->
  <section id="menu" class="screen" hidden>
    <h1>Mosha <span class="hl">Mara</span></h1>
    <p class="tagline">Swat the Dhaka mosquitoes before dark.</p>
    <p id="hello" class="note"></p>
    <button type="button" class="btn primary" id="start">Start</button>
    <p class="note">Thirty seconds. Tap every mosquito you can.</p>
  </section>

  <section id="over" class="screen" hidden>
    <h2>You swatted <span class="hl" id="final">0</span></h2>
    <p id="bestLine" class="note"></p>
    <p id="place" class="place"></p>
    <button type="button" class="btn primary" id="again">Play again</button>
    <button type="button" class="btn" id="share" hidden>Share</button>
  </section>

  <!-- The SDK file, copied next to the game (gives window.Ikirmikir). -->
  <script src="ikirmikir.js"></script>
  <script src="game.js"></script>
</body>
</html>
